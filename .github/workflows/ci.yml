name: CI

on:
  push:
    branches: [master, v2-development]
  pull_request:

# A newer push to the same branch cancels the older run, so an older run can
# never finish last and move the deploy pointer back to an older commit.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest

    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Install
        run: |
          npm ci
          npm ci --prefix frontend

      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format:check

      - name: Test
        run: npm test
        env:
          MONGO_TEST_URI: mongodb://127.0.0.1:27017

      - name: Build frontend
        run: npm run build --prefix frontend

  # Continuous delivery for the self-hosted tablet. Once a push to
  # v2-development passes every check, point the `v2-deploy` branch at that
  # commit. The tablet runs scripts/tab-deploy.sh, which watches `v2-deploy`,
  # so it only ever pulls commits that passed CI. See docs/TAB-DEPLOY.md.
  promote:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/v2-development'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Move v2-deploy to this commit
        run: git push --force origin "${GITHUB_SHA}:refs/heads/v2-deploy"
